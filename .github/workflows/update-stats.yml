name: Update Coding Stats

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install mongodb  # add this before the generate step
        
      - name: Generate stats JSON
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: node scripts/generate-stats.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/coding-stats.json
          git diff --staged --quiet || git commit -m "Update coding stats"
          git push
